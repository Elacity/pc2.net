name: Maintain Release Merge PR

on:
  workflow_dispatch:  # Manual trigger only - disabled for Elacity fork
  # push:
  #   branches:
  #     - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Setup Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      - name: Check for existing PR
        id: find-pr
        uses: juliangruber/find-pull-request-action@0d2ca757412e2742b5cd5ce4ff56757c65652605 # v1.12.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch: release
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.find-pr.outputs.number == ''
        with:
          ref: release
      - name: Reset release branch
        if: steps.find-pr.outputs.number == ''
        run: |
          git fetch origin main:main
          git reset --hard main
      - name: Create/Update PR
        if: steps.find-pr.outputs.number == ''
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update release branch
          title: Merge Release Auto-PR
          body: Merging this PR will invoke release actions          
          branch: auto-update/release
