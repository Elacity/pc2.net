on:
  workflow_dispatch:  # Manual trigger only - disabled for Elacity fork
  # push:
  #   branches:
  #     - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          release-type: node
