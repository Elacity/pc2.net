# Secret scanning — gitleaks
#
# Wave 4 of the SEC-2026-04-21-PC2-AUDIT (.cursor/tasks/...).
#
# Two-tier strategy:
#   1. Pull requests          → scan only the PR diff (fast, blocking).
#   2. Pushes to long-lived   → full working-tree scan (catches anything
#      branches                  that bypassed PR review).
#
# Configuration:
#   - Rules:        .gitleaks.toml        (extends default ruleset)
#   - Allowlist:    .gitleaksignore       (triaged historical findings)
#   - Local docs:   docs/wiki/Technical/SECRET_SCANNING.md
#
# Failure means a real or suspected leak. Process:
#   1. ROTATE the secret immediately. Don't delete the commit and assume
#      it's gone — assume the credential is already compromised.
#   2. Open a remediation task under .cursor/tasks/.
#   3. Add to .gitleaksignore (with TRIAGE comment + task link) ONLY if
#      the finding is a documented false-positive or already-rotated
#      historical artefact.

name: secret-scan

on:
  pull_request:
    branches: [main, master, develop, feature/**]
  push:
    branches: [main, master, develop, feature/lit-chipotle-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for PR diff scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org-account license for gitleaks-action v2 (free key). Required
          # since the action's breaking change that gates org use behind a
          # license. Stored as the GITLEAKS_LICENSE repo secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Use repo-local config (extends default ruleset).
          GITLEAKS_CONFIG: .gitleaks.toml
          # Don't ship the SARIF to GitHub Code Scanning unless we
          # explicitly enable a license; raw stderr/exit-code are enough
          # for blocking.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
