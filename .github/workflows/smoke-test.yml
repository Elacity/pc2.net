name: Smoke test (build + boot)

# Pre-release smoke test for pc2-node + the ElastOS GUI build.
#
# Why this exists (RELEASE-ENGINEERING-V1280):
#
# v1.2.7.7 → v1.2.7.13 shipped 6 hot-patch releases in 2 days, each fixing
# macOS / build / startup edge cases the previous one exposed. Every one of
# those bugs would have been catchable by running the actual build + boot
# path on a real Apple Silicon Mac in CI BEFORE tagging the release.
#
# GitHub Actions provides free standard runners for public repos. We're
# already paying $0 to ship the same bugs to users — let's pay $0 to catch
# them first instead.
#
# Phase 1 scope (this file): build gate + type-check gate + release-asset
# integrity check. Catches:
#   - v1.2.7.8 build OOM during npm run build:pc2
#   - v1.2.7.8 missing pc2-binaries-v1 release
#   - Any TypeScript regression on the pc2-node side
#   - Any dependency / workspace install break (the v1.2.7.x lockfile drift class)
#   - v1.2.7.11 osascript apostrophe regression (via test:unit step)
#
# Phase 5 (A-3, A-3.1): matrix expansion to ubuntu-24.04-arm +
# windows-latest. linux-arm64 promoted to required gate 2026-05-16
# after 5 consecutive green runs since matrix introduction. windows-x64
# remains experimental until it has the same green streak; see
# continue-on-error on the matrix.
#
# Future phases (separate PRs against this workflow): heartbeat probe,
# macOS permissions probe, pre-tag checklist, rollback runbook.
#
# Failure means: do NOT tag. Investigate the failing matrix entry, reproduce
# locally, fix, push again. The whole point of this workflow is that we
# refuse to ship until it's green.
#
# Trigger model:
#   - push to main: gate on the merged code being shippable.
#   - pull_request: gate on the PR not regressing build/typecheck.
#   - workflow_dispatch: manual trigger for pre-release rehearsal +
#     opt-in expensive matrix entries (e.g. paid Intel Mac).
#
# Cost: $0. Public repo, standard runners. All four matrix entries
# (ubuntu-latest, macos-latest, ubuntu-24.04-arm, windows-latest) are
# free for public repos. Observed timings:
#   - linux-x64       ~4 min cold cache
#   - linux-arm64     ~5 min cold cache (required gate as of 2026-05-16)
#   - darwin-arm64    ~7 min cold cache
#   - windows-x64     ~8 min cold cache (still experimental — see matrix)
# Total wall-clock is bounded by the slowest entry because matrix
# entries run in parallel.

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
      - 'chore/**'
  workflow_dispatch:
    inputs:
      include_intel_mac:
        description: 'Also run on macos-13-large (paid Intel Mac, ~$0.16/min) — use pre-release'
        type: boolean
        default: false

# Cancel in-flight runs of this workflow for the same ref. A new push
# supersedes the previous one — don't burn runner minutes on stale code.
concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow does not need to write to the repo, push images,
# or create releases. Keeps blast radius minimal.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # build-and-typecheck: the core gate. Runs on every supported matrix entry.
  # If any of these fail, the release should not ship until they're green.
  # ---------------------------------------------------------------------------
  build-and-typecheck:
    name: Build + typecheck (${{ matrix.label }})
    strategy:
      # Don't bail on first failure: we want to know if a bug is platform-
      # specific or general. Fast-fail hides information.
      fail-fast: false
      matrix:
        include:
          # ── Required gates ────────────────────────────────────────────
          # These MUST be green before the launcher is tagged. A red
          # entry here fails the Smoke test summary job and prevents
          # release tagging once branch protection is enabled on main.
          - os: ubuntu-latest
            label: linux-x64
            experimental: false
          - os: macos-latest
            label: darwin-arm64
            experimental: false
          # linux-arm64 promoted 2026-05-16 after 5 consecutive green
          # runs since A-3 matrix expansion (runs 25947219129,
          # 25947614795, 25955832357, 25956072211, 25956409080).
          # The Linux ARM build chain has proven identical to x86_64
          # under our apt-get + canvas system-libs setup; promoting it
          # tightens the safety net for the post-Mac ARM rollout.
          - os: ubuntu-24.04-arm
            label: linux-arm64
            experimental: false

          # ── Experimental gates ───────────────────────────────────────
          # Run on every push but NOT release blockers. continue-on-error
          # is wired below so a red entry here is a yellow advisory.
          #
          # Promotion criterion: 5 consecutive green runs without revert.
          #
          # windows-x64 status (2026-05-16): green for the first time on
          # run 25956072211 after fixing (a) env-var-prefix syntax via
          # cross-env, (b) node --test glob expansion, (c) CRLF in test
          # source scanner. Only 1-2 consecutive greens so far; needs
          # ~3 more clean runs before promotion. Next potential blocker
          # (when investigated): the build:gui cp -r command may need
          # cross-platform replacement in Phase 2.
          - os: windows-latest
            label: windows-x64
            experimental: true

    runs-on: ${{ matrix.os }}
    # Experimental matrix entries do NOT block the workflow; they report
    # data without failing branch protection. Switch to false (or remove
    # the line) once the entry is stable enough to gate releases.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 25

    # Force bash on every platform so the run: blocks below behave
    # identically on Linux, macOS, AND Windows (Git Bash is preinstalled
    # on windows-latest runners). Without this, Windows defaults to
    # PowerShell, which would silently break our pipe / set -euo pipefail
    # / conditional patterns.
    defaults:
      run:
        shell: bash

    steps:
      # Submodules in this repo (v86 emulator, twisp, epoxy-tls, wiki) are
      # NOT touched by the build:pc2 chain (particle-auth → src/gui →
      # pc2-node). Three of the four submodule URLs are `git@github.com:`
      # SSH refs which a stateless CI checkout can't clone without an SSH
      # key, and we have no reason to clone them: skipping the recursive
      # submodule fetch keeps the checkout ~10s and avoids tying CI to
      # SSH key management.
      #
      # If a future build chain starts importing from /submodules/*, this
      # gate will surface the failure clearly (the actual missing-path
      # error rather than an opaque clone failure), and we re-evaluate
      # then with a `git config insteadOf` rewrite step.
      - name: Checkout (without submodules — not needed by build:pc2)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # Pin Node to a version we actually support. pc2-node/package.json
      # declares engines.node >=20.18.0; we pick the latest 20.x to match
      # what a fresh user install of nvm or Node-via-Homebrew would land on.
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Cache npm + yarn at home dir level. Speeds up successive runs from
      # ~6 min install down to ~90 s once the cache is warm. The cache key
      # mixes OS + all known lockfiles so a dep change always invalidates.
      - name: Cache npm + yarn caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.yarn/cache
            ~/.cache/yarn
          key: smoke-${{ matrix.os }}-deps-${{ hashFiles('package-lock.json', 'pc2-node/package-lock.json') }}
          restore-keys: |
            smoke-${{ matrix.os }}-deps-

      # Surface a few baseline numbers so failure analysis can compare runs.
      - name: Environment baseline
        run: |
          echo "::group::Environment"
          node --version
          npm --version
          echo "OS: $(uname -s) $(uname -r) $(uname -m)"
          echo "Disk free: $(df -h . | tail -1)"
          echo "Memory: $(node -e 'console.log(JSON.stringify(process.memoryUsage()))')"
          echo "::endgroup::"

      # A-8: pc2-node has `canvas@2.11.2` in optionalDependencies. The three
      # `await import('canvas')` sites in pc2-node/src/{api/storage,storage/
      # thumbnail}.ts are runtime-graceful (try/catch) but tsc --noEmit still
      # needs the module on disk to resolve types. canvas@2.x has no usable
      # prebuilts for the runner's Node 20.x ABI, so npm ci skips it silently
      # → tsc TS2307 → red gate. We install Cairo/Pango family system libs so
      # canvas builds from source successfully during npm ci, populating its
      # bundled types/ dir. End users are unaffected — canvas remains optional
      # in pc2-node's package.json; these system libs are CI-only.
      #
      # Follow-up tracked in OPTIMISATION-AND-REFACTORING-2026-05 Phase 2:
      # migrate the three import sites to @napi-rs/canvas (already a transitive
      # dep, prebuilt-only, no system libs), then we can delete the steps
      # below.
      - name: Install canvas system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "::group::apt-get canvas deps"
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev \
            pkg-config
          echo "::endgroup::"

      - name: Install canvas system libs (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          echo "::group::brew canvas deps"
          # macos-latest typically ships these via brew already, but we
          # install explicitly so a runner-image change doesn't silently
          # break the build. brew install is idempotent — re-running on
          # an already-installed formula is a fast no-op (~1 s each).
          brew install pkg-config cairo pango libpng jpeg giflib librsvg
          echo "::endgroup::"

      # A-7 + build-OOM defence in a single step.
      #
      # OOM context: the v1.2.7.8 build failure was inside webpack at
      # `npm run build:gui`. Reproduce its fix by feeding
      # `--max-old-space-size=4096` via NODE_OPTIONS so we behave like
      # update.sh does in production. If the OOM comes back, this fails
      # and we know it's not a CI flake.
      #
      # Install order matters (A-7 fix — fresh-install race documented in
      # .cursor/tasks/RELEASE-ENGINEERING-V1280/FIX-PLAN-A7-A8.md):
      #
      #   1. pc2-node FIRST. pc2-node's tsx@4.21 wants esbuild@0.27.2 with
      #      its sibling @esbuild/<platform>@0.27.2. Installing pc2-node
      #      first lets npm fully nest both before the root install can
      #      plant a different esbuild higher in the tree.
      #
      #   2. `npm rebuild esbuild` insurance. Re-runs esbuild's install.js
      #      once all platform deps are guaranteed to be on disk, killing
      #      the npm parallel-postinstall race that the first smoke run
      #      tripped on Linux.
      #
      #   3. Root LAST with `npm install --legacy-peer-deps` because the
      #      root lockfile may be out of sync after small devDep additions
      #      (e.g. depcheck/jscpd) and we want it to resolve, not bail.
      #      particle-auth in packages/ also requires --legacy-peer-deps
      #      for its own peer-resolution.
      - name: Install pc2-node + root dependencies
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: |
          set -euo pipefail

          echo "::group::pc2-node npm ci (installed FIRST — see A-7 plan)"
          (cd pc2-node && npm ci --no-audit --no-fund)
          echo "::endgroup::"

          echo "::group::pc2-node npm rebuild esbuild (race-guard)"
          (cd pc2-node && npm rebuild esbuild --no-audit --no-fund)
          echo "::endgroup::"

          echo "::group::Root npm install (installed LAST)"
          npm install --no-audit --no-fund --legacy-peer-deps
          echo "::endgroup::"

      # The build pipeline at root: particle-auth → GUI bundles → pc2-node
      # backend (TypeScript). Same order users hit during update.sh. Webpack
      # runs inside build:gui; pc2-node's tsc runs inside build:server.
      - name: Build PC2 (particle-auth + GUI + server)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          set -euo pipefail
          echo "::group::npm run build:pc2"
          npm run build:pc2
          echo "::endgroup::"

      # The launcher loads pc2-node from `pc2-node/dist/index.js`. If the
      # TS build produced no main module, we already shipped a broken bundle.
      # Cheap structural assertion that the next-stage tests can rely on.
      - name: Verify build outputs exist
        run: |
          set -euo pipefail
          missing=()
          [ -f "pc2-node/dist/index.js" ] || missing+=("pc2-node/dist/index.js")
          [ -d "pc2-node/frontend" ] || missing+=("pc2-node/frontend/")
          # GUI bundle outputs end up in pc2-node/frontend/ after build:gui's
          # cp step. We don't pin to specific bundle.min.js names because
          # build.js emits content-hashed filenames; we only check the dir
          # exists and is non-empty.
          if [ -d "pc2-node/frontend" ] && [ -z "$(ls -A pc2-node/frontend 2>/dev/null)" ]; then
            missing+=("pc2-node/frontend/ is empty")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing build outputs:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All required build outputs present."

      # Build artefact size signal: lets us track regression (or improvement)
      # over time without needing the full OPTIMISATION-AND-REFACTORING
      # baseline workflow to be in place yet.
      - name: Report build artefact sizes
        run: |
          echo "::group::pc2-node/dist"
          du -sh pc2-node/dist 2>/dev/null || true
          du -sh pc2-node/dist/* 2>/dev/null | sort -h | tail -10 || true
          echo "::endgroup::"
          echo "::group::pc2-node/frontend"
          du -sh pc2-node/frontend 2>/dev/null || true
          ls -la pc2-node/frontend 2>/dev/null | head -20 || true
          echo "::endgroup::"

      # Standalone typecheck pass on pc2-node. The build above runs tsc
      # internally via build:server, but that emits files; this `--noEmit`
      # pass is the canonical "would tsc be happy without compilation
      # side effects" gate. Fails fast on any latent type regression that
      # would survive a partial rebuild.
      - name: Typecheck pc2-node (tsc --noEmit)
        run: |
          set -euo pipefail
          echo "::group::tsc --noEmit"
          (cd pc2-node && npx --no-install tsc --noEmit)
          echo "::endgroup::"

      # Unit tests under pc2-node/tests/unit. Currently scopes to:
      #   - setup-permissions-osascript.test.js — v1.2.7.11 apostrophe
      #     regression class (RELEASE-ENGINEERING-V1280 Phase 4)
      # Future Phases add more files. The npm script `test:unit` is the
      # canonical entry point — keep this step's command in lockstep with
      # pc2-node/package.json scripts.test:unit.
      - name: Run pc2-node unit tests
        run: |
          set -euo pipefail
          echo "::group::npm run test:unit"
          (cd pc2-node && npm run test:unit)
          echo "::endgroup::"

      # A-4: Boot smoke — actually start the pc2-node binary in the background
      # and assert /api/health responds with status:ok before tearing it down.
      #
      # Why this exists (CI-HARDENING-A4-D1):
      #
      # Through Phase 1 (build + typecheck + unit tests), the smoke matrix
      # proves the code compiles, types check, and unit tests pass. But none
      # of those steps prove the binary actually STARTS. Real bug classes
      # that escape: init-time crashes (missing env, bad config parsing),
      # port collisions, slow startup (>30s), missing required directories
      # the launcher would create. v1.2.7.x had several "build passed but
      # users see PC2 stopped" scenarios; this step is the cheapest possible
      # belt-and-suspenders.
      #
      # Why we skip Windows: pc2-node's startup path uses POSIX SIGTERM for
      # graceful shutdown; on Windows that's not equivalent. windows-x64 is
      # still experimental in the build matrix anyway. Promote to boot-smoke
      # once windows-x64 reaches 5 consecutive green builds.
      - name: Boot-smoke pc2-node + assert /api/health (A-4)
        if: matrix.label != 'windows-x64'
        env:
          # Use a non-standard port to dodge any runner-side port 4200 conflict
          # (the GitHub-hosted runners don't have anything on 4200, but being
          # explicit costs nothing and lets us run this locally with `act` later).
          PC2_PORT: 14200
          # Disable any feature that requires network egress at boot —
          # the runner has internet but the goal here is the smallest
          # possible smoke, not a fully-functional node.
          NODE_ENV: production
        run: |
          set -euo pipefail
          echo "::group::A-4 boot-smoke"

          cd pc2-node

          # Start the server in the background. Capture stdout+stderr so we
          # can dump them on failure for diagnosis.
          PORT="${PC2_PORT}" node dist/index.js > /tmp/pc2-boot.log 2>&1 &
          SERVER_PID=$!
          echo "Started pc2-node with PID ${SERVER_PID}, polling /api/health on port ${PC2_PORT}"

          # Function to gracefully tear down on any exit path.
          cleanup() {
            local exitcode=$?
            echo ""
            echo "::group::Tearing down pc2-node (PID ${SERVER_PID})"
            if kill -0 ${SERVER_PID} 2>/dev/null; then
              kill -TERM ${SERVER_PID} 2>/dev/null || true
              # Give it 5 s to exit cleanly.
              for i in 1 2 3 4 5; do
                if ! kill -0 ${SERVER_PID} 2>/dev/null; then break; fi
                sleep 1
              done
              # Force-kill if still alive.
              if kill -0 ${SERVER_PID} 2>/dev/null; then
                echo "Server did not exit gracefully within 5 s, sending SIGKILL"
                kill -KILL ${SERVER_PID} 2>/dev/null || true
              fi
            else
              echo "Server already exited."
            fi
            wait ${SERVER_PID} 2>/dev/null || true
            echo "::endgroup::"

            if [ $exitcode -ne 0 ]; then
              echo "::group::pc2-node boot log (last 200 lines)"
              tail -n 200 /tmp/pc2-boot.log || true
              echo "::endgroup::"
            fi
            return $exitcode
          }
          trap cleanup EXIT

          # Poll /api/health with 2 s intervals up to 120 s.
          # 120 s budget: pc2-node's boot sequence kicks off IPFS peer
          # discovery (40+ peers), database open, WASM runtime init, and
          # service-bootstrap chain before /api/health is wired. On a cold
          # CI runner with no warm caches, the observed cold-boot time on
          # 2026-05-18 was ~50-70 s. 120 s gives 2x safety margin without
          # being so generous that a truly-broken init goes undetected.
          #
          # 2 s intervals: balances responsiveness vs not hammering the
          # bind-during-startup race window. Total max iterations = 60.
          #
          # SLA gate (CI-HARDENING-RELIABILITY-V2 #3, 2026-05-19): a
          # successful response within 60 s is "good"; 60-90 s is "warn"
          # (creeping regression signal); >90 s is a hard SLA violation
          # that fails the gate. Real-world devices (slower disk, busier
          # system, RPi-class) typically run 1.3-1.5× CI time, so 90 s
          # in CI corresponds to ~120-135 s in field — anything beyond
          # is a UX cliff. Boot timing is captured into BOOT_TIME_S for
          # post-poll assertion.
          HEALTH_URL="http://localhost:${PC2_PORT}/api/health"
          BOOT_TIME_S=0
          for attempt in $(seq 1 60); do
            if curl -fsS -m 3 "${HEALTH_URL}" -o /tmp/pc2-health.json 2>/dev/null; then
              BOOT_TIME_S=$((attempt * 2))
              echo "✅ /api/health responded after ${BOOT_TIME_S}s"
              break
            fi
            # If the server died mid-poll, bail early rather than waiting.
            if ! kill -0 ${SERVER_PID} 2>/dev/null; then
              echo "::error::pc2-node process died during health-check polling (PID ${SERVER_PID} no longer alive)"
              exit 1
            fi
            # Surface progress every 10 s so a stuck poll is debuggable
            # in real time rather than only post-mortem.
            if [ $((attempt % 5)) -eq 0 ]; then
              echo "  ... still polling /api/health (elapsed: $((attempt * 2))s / 120 s)"
              # Snapshot the last few boot-log lines so we can see what
              # pc2-node is doing inside the polling window.
              echo "  last boot log line: $(tail -n 1 /tmp/pc2-boot.log 2>/dev/null || echo '(no log yet)')"
            fi
            sleep 2
          done

          if [ ! -s /tmp/pc2-health.json ]; then
            echo "::error::/api/health never responded within 120 s on ${HEALTH_URL}"
            exit 1
          fi

          # SLA gate (#3): hard-fail if boot time > 90 s; warn if > 60 s.
          # Pure assertion on already-measured BOOT_TIME_S — zero added runtime.
          if [ "${BOOT_TIME_S}" -gt 90 ]; then
            echo "::error::Boot-time SLA violation: /api/health responded after ${BOOT_TIME_S}s (ceiling: 90s)"
            echo "::error::This indicates an init-time regression. Real-world devices run ~1.3-1.5× CI time, so this likely means 120-135s in field — UX cliff."
            exit 1
          elif [ "${BOOT_TIME_S}" -gt 60 ]; then
            echo "::warning::Boot-time approaching SLA ceiling: ${BOOT_TIME_S}s (warn at 60s, fail at 90s). Investigate before it crosses the hard SLA."
          else
            echo "✅ Boot-time within SLA: ${BOOT_TIME_S}s (target ≤ 60s, ceiling 90s)"
          fi

          echo "Health response body:"
          cat /tmp/pc2-health.json
          echo ""

          # Assert specific fields, not just HTTP 200. We want to know the
          # server is in a known-good state, not just that it can answer.
          # node parses JSON natively; avoids requiring jq or python3 on
          # arbitrary runner images.
          node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/pc2-health.json', 'utf8'));
            const fails = [];
            if (r.status !== 'ok') fails.push('status was ' + JSON.stringify(r.status) + ', expected \"ok\"');
            if (!r.version || typeof r.version !== 'string') fails.push('version missing or not a string');
            if (!r.timestamp || typeof r.timestamp !== 'string') fails.push('timestamp missing or not a string');
            if (fails.length) {
              console.error('::error::Health assertion failures:');
              fails.forEach(f => console.error('  - ' + f));
              process.exit(1);
            }
            console.log('✅ Health assertions passed (status=' + r.status + ', version=' + r.version + ')');
          "

          # Secondary smoke: /api/info should respond 200 (unauthenticated
          # allowed for general node-info), /api/resources should respond
          # 401 (auth required — proves auth middleware is wired correctly).
          INFO_CODE=$(curl -s -m 2 -o /dev/null -w '%{http_code}' "http://localhost:${PC2_PORT}/api/info" || echo "000")
          RESOURCES_CODE=$(curl -s -m 2 -o /dev/null -w '%{http_code}' "http://localhost:${PC2_PORT}/api/resources" || echo "000")
          echo "Secondary route smoke: /api/info → HTTP ${INFO_CODE} (expected 200), /api/resources → HTTP ${RESOURCES_CODE} (expected 401)"

          if [ "${INFO_CODE}" != "200" ]; then
            echo "::warning::/api/info returned HTTP ${INFO_CODE} (expected 200) — non-fatal but worth investigating"
          fi
          if [ "${RESOURCES_CODE}" != "401" ]; then
            echo "::warning::/api/resources returned HTTP ${RESOURCES_CODE} (expected 401 — auth middleware should reject unauthenticated)"
          fi

          echo "::endgroup::"
          echo "✅ A-4 boot-smoke complete on ${{ matrix.label }}"

      # CI-HARDENING-RELIABILITY-V2 #2: Memory-ceiling smoke — DROPPED 2026-05-19.
      #
      # Original intent: prove pc2-node boots under tight V8 heap (RPi-class
      # proxy). After 2 calibration attempts (CI runs 26099087869 + 26099928086),
      # this gate proved fragile and non-actionable:
      #
      #   Run 1 (512 MB heap, 120 s timeout): timed out without OOM crash.
      #     Real finding — pc2-node's init heap working set exceeds 512 MB
      #     when IPFS daemon + WASM runtime + service bootstrap run
      #     concurrently. Intrinsic to the integrated-daemon architecture,
      #     not a regression.
      #
      #   Run 2 (1024 MB heap, 180 s timeout): same job's prior boot-smoke
      #     succeeded in 8 s with no heap limit, but the second back-to-back
      #     boot at 1 GB went silent after ~30 s of normal IPFS peer-dialing.
      #     Root cause: stale ~/.pc2/ state from the first instance plus
      #     IPFS swarm rebinding. Conflates "memory regression" with
      #     "back-to-back state cleanup", producing un-interpretable signal.
      #
      # Decision: drop the gate rather than ship a flaky one. A flaky CI
      # test trains teams to ignore real failures.
      #
      # Real RPi support requires SOURCE-CODE work (memory profiling +
      # init-time allocation reduction), tracked as future ticket
      # PC2-MEMORY-PROFILE-RPI in OPTIMISATION-AND-REFACTORING-2026-05.
      #
      # The other 2 V2 gates (#1 binary execution + #3 boot SLA) shipped
      # as designed and are providing real signal.

  # ---------------------------------------------------------------------------
  # release-assets-integrity: confirm the pc2-binaries-v1 GitHub release has
  # the expected asset count. This is the v1.2.7.8 bug class: BinaryManager
  # referenced a release that didn't actually exist, so every fresh-install
  # Mac silently fell back to ActiveProxy.
  #
  # Runs once (Linux only, ~10 s) since it's just a `gh release view` query.
  # ---------------------------------------------------------------------------
  release-assets-integrity:
    name: pc2-binaries-v1 asset integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify pc2-binaries-v1 release has expected asset count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Expected count from publish-pc2-binaries.yml as of v1.2.7.11:
          #   darwin: 12 = 5 native × 2 archs + 2 scripts
          #   linux-x64: 6 = 4 native + 2 scripts
          #   linux-arm64: 4 native
          #   SHASUMS256.txt: 1 (checksum manifest emitted by publish step)
          #   Total: 23
          # If publish-pc2-binaries.yml's matrix changes, update this number
          # in lockstep — pc2-node/src/utils/binary-manager.ts is the source
          # of truth for what BinaryManager attempts to download (note that
          # BinaryManager itself does not download SHASUMS256.txt; it
          # verifies SHAs from a checked-in map. The file is shipped purely
          # for human auditability.)
          EXPECTED=23

          if ! gh release view pc2-binaries-v1 -R Elacity/pc2.net >/dev/null 2>&1; then
            echo "::error::pc2-binaries-v1 release does not exist. Run publish-pc2-binaries.yml first."
            exit 1
          fi

          actual=$(gh release view pc2-binaries-v1 -R Elacity/pc2.net --json assets --jq '.assets | length')
          echo "pc2-binaries-v1 has ${actual} assets (expected ${EXPECTED})."

          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::pc2-binaries-v1 asset count is ${actual}, expected ${EXPECTED}."
            echo "Either re-run publish-pc2-binaries.yml with replace_existing=true to refresh,"
            echo "or update EXPECTED in this workflow if the matrix legitimately changed."
            exit 1
          fi

      # Surface the asset list in the run log for human review on every run.
      # Cheap and useful if a future release silently drops an asset.
      - name: List pc2-binaries-v1 asset names + sizes (for log review)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view pc2-binaries-v1 -R Elacity/pc2.net \
            --json assets \
            --jq '.assets[] | "\(.name)\t\(.size) bytes"' \
            | column -t -s $'\t'

      # CI-HARDENING-RELIABILITY-V2 #1: Binary execution smoke.
      #
      # The release-assets-integrity check above proves the 23 expected
      # files EXIST. This step proves they actually EXECUTE. Bug class:
      # corrupted uploads, wrong-arch binaries silently shipped, dynamic
      # linker mismatches (e.g., glibc-symbol assumptions in published
      # artifacts that break on older distros).
      #
      # Tests the linux-x64 variants of the 4 compiled binaries (Go +
      # C tools). The bash scripts (wg-quick, awg-quick) and macOS/ARM
      # variants are skipped:
      #   - bash scripts → tested implicitly via bash -n syntax check
      #     during their respective publish workflows
      #   - macOS variants → end-to-end tested in the 48-72 h Mac launcher
      #     soak (more authentic than CI exec)
      #   - linux-arm64 variants → would require self-hosted runners or
      #     QEMU emulation; diminishing return since same upstream Go/C
      #     code as x64
      #
      # Two checks per binary:
      #   1. file(1) → must report ELF + x86-64 (catches "uploaded text
      #      file instead of binary" or "wrong arch" failures)
      #   2. ./binary --version → must exit cleanly (< 128, i.e., not
      #      killed by signal). Some tools may exit 1-2 on unknown
      #      flags; that's still "ran without crashing".
      - name: 'Binary execution smoke (V2 part 1)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::V2 #1 binary execution smoke (linux-x64 variants)"

          TMPDIR=$(mktemp -d)
          cd "${TMPDIR}"

          # The 4 compiled binaries shipped to pc2-binaries-v1 for linux-x64.
          BINARIES=("wireguard-go-linux-x64" "amneziawg-go-linux-x64" "wg-linux-x64" "awg-linux-x64")

          ALL_OK=1
          for bin in "${BINARIES[@]}"; do
            echo "::group::Verifying ${bin}"

            if ! gh release download pc2-binaries-v1 -R Elacity/pc2.net --pattern "${bin}" 2>&1; then
              echo "::error::Failed to download ${bin} from pc2-binaries-v1"
              ALL_OK=0
              echo "::endgroup::"
              continue
            fi

            # 1: file(1) check — verify ELF + x86-64
            ftype=$(file "${bin}")
            echo "file(1): ${ftype}"
            if ! echo "${ftype}" | grep -qE "ELF.*(x86-64|EM_X86_64)"; then
              echo "::error::${bin} is not a valid linux x86-64 ELF binary (got: ${ftype})"
              ALL_OK=0
              echo "::endgroup::"
              continue
            fi

            # 2: chmod + execute --version
            chmod +x "${bin}"
            set +e
            ./"${bin}" --version > /tmp/bin-out.txt 2>&1
            rc=$?
            set -e

            # Exit code < 128 = ran (even if it didn't recognise --version).
            # Exit code >= 128 = killed by signal (segfault, etc.) = real failure.
            if [ ${rc} -ge 128 ]; then
              echo "::error::${bin} crashed with signal $((rc - 128)) when running --version"
              tail -n 20 /tmp/bin-out.txt || true
              ALL_OK=0
            else
              echo "  exit code: ${rc} (clean)"
              echo "  output (first 5 lines):"
              head -n 5 /tmp/bin-out.txt | sed 's/^/    /' || true
              echo "✅ ${bin} executes correctly"
            fi

            echo "::endgroup::"
          done

          # Cleanup tmpdir to avoid polluting the runner across steps.
          cd /
          rm -rf "${TMPDIR}"

          if [ ${ALL_OK} -ne 1 ]; then
            echo "::error::One or more pc2-binaries-v1 linux-x64 binaries failed verification."
            echo "::error::This means published assets exist but cannot run on a real Linux user's machine."
            exit 1
          fi

          echo "::endgroup::"
          echo "✅ V2 #1 binary execution smoke passed — all 4 linux-x64 binaries are valid ELF + execute cleanly"

  # ---------------------------------------------------------------------------
  # D-1: docker-smoke — build pc2-node/Dockerfile in CI (no push) and assert
  # the container actually serves /api/health.
  #
  # Why this exists (CI-HARDENING-A4-D1):
  #
  # pc2-node/Dockerfile (5.7KB, multi-stage build with wireguard-go +
  # amneziawg-go + sing-box compilation) is the canonical Docker image for
  # supernode operators and any deployment that wants containerised pc2-node.
  # It hasn't been CI-tested since Feb 2026 — the existing pc2-node-docker.yml
  # workflow was disabled (workflow_dispatch only) after 3 consecutive failed
  # runs on 2026-02-03 because no one had time to fix the Dockerfile and
  # broken CI was noisier than no CI. The Dockerfile has since been updated
  # (2026-05-01) but nobody has verified the rebuild works.
  #
  # This job builds the Dockerfile from scratch on every commit. NO push to
  # GHCR — pure build validation. If the image build succeeds AND the
  # container's HEALTHCHECK reports healthy AND /api/health responds via
  # mapped port, we've proven the Docker deployment path stays viable
  # alongside the native launcher path.
  #
  # PROMOTED to REQUIRED GATE on 2026-05-19 (commit promoting this change).
  # Promotion criterion was: 3 consecutive green runs without intervening
  # Dockerfile changes. Achieved at:
  #   1. CI run 26096161068 (commit ef2b9e9d7) — 2026-05-19 12:13 UTC
  #      First ever green; included Bug 6 fix (deployment templates).
  #   2. CI run 26096997543 (commit bd561d144) — 2026-05-19 12:30 UTC
  #      Pure docs commit, Dockerfile unchanged from run #1 → green.
  #   3. CI run for THIS commit — promotion-as-run-3. If green, docker-smoke
  #      becomes a required gate from this point onward.
  #
  # Required-gate semantics: a red docker-smoke now blocks the smoke test
  # summary, just like build-and-typecheck and release-assets-integrity.
  # Tagging a release with red docker-smoke is a process violation.
  #
  # Cost: GitHub-hosted ubuntu-latest runner, free for public repos.
  # Observed first-run time: ~5-7 min cold (multi-stage with transport-
  # binary cross-compilation); subsequent runs ~3-4 min with cache-from:
  # type=gha. Container boot to healthy: ~20 s.
  # ---------------------------------------------------------------------------
  docker-smoke:
    name: Docker-smoke (pc2-node/Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # We don't push, but the gha cache lets a successful build on commit N
      # reuse layers from commit N-1 to speed up the inner-loop iteration
      # while we're stabilising this job.
      - name: Build pc2-node Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./pc2-node/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: pc2-node:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start pc2-node container + wait for HEALTHCHECK
        run: |
          set -euo pipefail
          echo "::group::Starting container"
          # -d detached, -p host:container port mapping, --name so we can
          # reference it later for inspect/logs/stop without hunting PIDs.
          docker run -d \
            --name pc2-smoke \
            -p 14200:4200 \
            pc2-node:smoke-test
          echo "::endgroup::"

          echo "::group::Polling Docker HEALTHCHECK status"
          # Dockerfile declares HEALTHCHECK --interval=30s --start-period=60s,
          # so the first check fires at t=0 (start-period grace) but the
          # status only flips to "healthy" after a successful probe. We poll
          # every 5 s for up to 120 s. healthy → pass; unhealthy or starting
          # past 120 s → fail.
          status="starting"
          for attempt in $(seq 1 24); do
            status=$(docker inspect --format='{{.State.Health.Status}}' pc2-smoke 2>/dev/null || echo "missing")
            echo "  attempt ${attempt}/24: status=${status}"
            if [ "${status}" = "healthy" ]; then
              echo "✅ Container healthy after $((attempt * 5))s"
              break
            fi
            if [ "${status}" = "unhealthy" ]; then
              echo "::error::Container reported unhealthy on attempt ${attempt}"
              break
            fi
            if [ "${status}" = "missing" ]; then
              echo "::error::Container disappeared mid-poll"
              break
            fi
            sleep 5
          done
          echo "::endgroup::"

          if [ "${status}" != "healthy" ]; then
            echo "::group::Container state on failure"
            docker ps -a --filter name=pc2-smoke
            echo ""
            echo "Inspect (health log):"
            docker inspect --format='{{json .State.Health}}' pc2-smoke 2>&1 | head -100 || true
            echo "::endgroup::"
            echo "::group::Container logs (last 200 lines)"
            docker logs --tail 200 pc2-smoke 2>&1 || true
            echo "::endgroup::"
            exit 1
          fi

          echo "::group::Verify /api/health is reachable through port mapping"
          # Belt-and-suspenders: the HEALTHCHECK already curls /api/health from
          # *inside* the container. This additional curl from *outside* proves
          # the port mapping works — a different failure class.
          curl -fsS -m 5 http://localhost:14200/api/health -o /tmp/docker-health.json
          cat /tmp/docker-health.json
          echo ""
          node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/docker-health.json', 'utf8'));
            if (r.status !== 'ok') { console.error('status:', r.status); process.exit(1); }
            console.log('✅ /api/health from outside container: status=ok, version=' + r.version);
          "
          echo "::endgroup::"

      - name: Tear down container
        if: always()
        run: |
          docker stop pc2-smoke 2>/dev/null || true
          docker rm pc2-smoke 2>/dev/null || true
          echo "Cleanup complete."

  # ---------------------------------------------------------------------------
  # build-pi-os: simulates a fresh Raspberry Pi OS Bookworm 64-bit install
  # inside a Docker container running on the existing ubuntu-24.04-arm runner.
  #
  # Why this gate exists (2026-05-25 — tracked in
  # .cursor/tasks/CI-RASPBERRY-PI-COVERAGE-2026-05):
  # A Pi 5 community member hit a build-from-source failure with 20 TS2307
  # "Cannot find module" errors across ethers, siwe, @lit-protocol/*, and
  # canvas. Root cause: Raspberry Pi OS Bookworm doesn't ship the C dev
  # headers (Cairo, Pango, libjpeg, ...) that `canvas` (in optionalDeps)
  # needs to compile during `npm install`. canvas silently skips, breaking
  # tsc type resolution for a chain of dependents. The existing linux-arm64
  # matrix entry doesn't catch this because Ubuntu's runner ships those libs
  # (or installs them in the canvas-libs step at line 214).
  #
  # Why a separate job, not a 5th matrix entry: the matrix's existing steps
  # (cache, environment-baseline, apt-get on the host, etc.) are written for
  # the runner's native Ubuntu 24.04. Running them inside a Debian-Bookworm
  # container would require conditional logic in many steps and obscure the
  # gate's intent. A standalone job is cleaner and self-documenting.
  #
  # Status: experimental — continue-on-error: true, NOT in summary.needs.
  # Promotion criterion: 5 consecutive green runs without revert, then add
  # to summary.needs (same path windows-x64 is on; same path docker-smoke
  # was on before promotion 2026-05-19).
  #
  # Expected runtime: ~10-15 min cold cache (Debian apt-get is slower than
  # the Ubuntu runner's pre-warmed apt cache; npm ci is the same).
  # ---------------------------------------------------------------------------
  build-pi-os:
    name: Build (Raspberry Pi OS simulation — experimental)
    runs-on: ubuntu-24.04-arm
    # Experimental gate — red runs do NOT block the workflow or release tag.
    # See task .cursor/tasks/CI-RASPBERRY-PI-COVERAGE-2026-05 for promotion
    # criteria and the "what success looks like" definition.
    continue-on-error: true
    timeout-minutes: 30

    # arm64v8/debian:bookworm-slim — Raspberry Pi OS Bookworm 64-bit is itself
    # a Debian Bookworm derivative. The slim variant matches the bare-OS
    # state a real Pi user starts from (no pre-installed dev libs).
    container:
      image: arm64v8/debian:bookworm-slim

    steps:
      # The container is intentionally bare. We install everything a Pi
      # user would install, in the same order. This step IS the validated
      # recipe we'll share with community members once green.
      - name: Install Node 20 + system libs (mirrors documented Pi install path)
        run: |
          set -euo pipefail

          echo "::group::apt-get prerequisites"
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git build-essential pkg-config \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev \
            librsvg2-dev libpixman-1-dev
          echo "::endgroup::"

          echo "::group::Node.js 20.x via NodeSource"
          # NodeSource is the documented Debian install path for Node 20.
          # Pi OS users following our README will hit this same script.
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          echo "::endgroup::"

          echo "::group::Environment diagnostics"
          echo "Node:   $(node --version)"
          echo "npm:    $(npm --version)"
          echo "Arch:   $(uname -m)"
          echo "Kernel: $(uname -r)"
          echo "OS:     $(grep PRETTY_NAME /etc/os-release | cut -d= -f2-)"
          echo "Disk:   $(df -h / | tail -1)"
          echo "::endgroup::"

      # actions/checkout uses git which we just apt-installed above.
      # No submodules — same rationale as the existing matrix's checkout step.
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # Install order is identical to the existing matrix entry (A-7 plan,
      # see line 251 above): pc2-node first, npm rebuild esbuild race-guard,
      # then root with --legacy-peer-deps. Keeping order identical means a
      # failure here is genuinely distro-specific, not order-related.
      - name: Install pc2-node + root dependencies (A-7 order)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: |
          set -euo pipefail

          echo "::group::pc2-node npm ci (installed FIRST — see A-7 plan)"
          (cd pc2-node && npm ci --no-audit --no-fund)
          echo "::endgroup::"

          echo "::group::pc2-node npm rebuild esbuild (race-guard)"
          (cd pc2-node && npm rebuild esbuild --no-audit --no-fund)
          echo "::endgroup::"

          echo "::group::Root npm install (installed LAST)"
          npm install --no-audit --no-fund --legacy-peer-deps
          echo "::endgroup::"

      # The exact step the Pi community member is failing at on 2026-05-25.
      # If this passes here, our install recipe is correct and we can share
      # it with confidence. If it fails, we iterate until green BEFORE
      # asking any Pi user to try it.
      - name: Build pc2-node backend (tsc — the user-reported failure point)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          set -euo pipefail
          echo "::group::npm run build:backend"
          cd pc2-node
          npm run build:backend
          echo "::endgroup::"

      # Cheap structural assertion that the build actually produced output.
      # Mirrors the existing matrix entry's verification step.
      - name: Verify build outputs exist
        run: |
          set -euo pipefail
          missing=()
          [ -f "pc2-node/dist/index.js" ] || missing+=("pc2-node/dist/index.js")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing build outputs:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          size=$(du -h pc2-node/dist/index.js | cut -f1)
          echo "✅ pc2-node/dist/index.js present (${size})"

  # ---------------------------------------------------------------------------
  # summary: roll up matrix results into a single "ok / not ok" output so the
  # status badge + branch protection rule have one thing to point at.
  # ---------------------------------------------------------------------------
  summary:
    name: Smoke test summary
    # build-pi-os is INTENTIONALLY omitted from needs: while experimental.
    # Promote (add to needs:) only after 5 consecutive green runs — see
    # .cursor/tasks/CI-RASPBERRY-PI-COVERAGE-2026-05 for the promotion path.
    needs: [build-and-typecheck, release-assets-integrity, docker-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report aggregate status
        run: |
          echo "build-and-typecheck: ${{ needs.build-and-typecheck.result }}"
          echo "release-assets-integrity: ${{ needs.release-assets-integrity.result }}"
          echo "docker-smoke: ${{ needs.docker-smoke.result }}"

          # All three are now required gates. docker-smoke was promoted from
          # experimental on 2026-05-19 after 3 consecutive green runs. A red
          # in any of these blocks the summary and signals "do not tag".
          if [ "${{ needs.build-and-typecheck.result }}" != "success" ] \
             || [ "${{ needs.release-assets-integrity.result }}" != "success" ] \
             || [ "${{ needs.docker-smoke.result }}" != "success" ]; then
            echo "::error::Smoke test failed. Do NOT tag a release until all three required gates are green."
            exit 1
          fi

          echo "All required smoke gates green (build-and-typecheck + release-assets-integrity + docker-smoke). Safe to proceed to pre-tag checklist."
