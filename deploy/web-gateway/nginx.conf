# PC2 Gateway Load Balancer Configuration
#
# This nginx configuration provides:
# - Round-robin load balancing across gateway instances
# - WebSocket support
# - Health check endpoints
# - SSL termination (with proper certs)

events {
    worker_connections 4096;
}

http {
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstream gateway cluster
    upstream gateways {
        # Round-robin by default
        # Use ip_hash for sticky sessions if needed
        # ip_hash;
        
        server gateway1:80 weight=1 max_fails=3 fail_timeout=30s;
        server gateway2:80 weight=1 max_fails=3 fail_timeout=30s;
        # server gateway3:80 weight=1 max_fails=3 fail_timeout=30s;
        
        # Keep connections alive
        keepalive 32;
    }

    # HTTP server (redirect to HTTPS in production)
    server {
        listen 80;
        server_name *.ela.city ela.city;

        # Health check endpoint (no redirect)
        location = /api/health {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # In production, redirect to HTTPS
        # Uncomment when SSL is configured:
        # return 301 https://$host$request_uri;

        # For development/testing, proxy directly
        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # HTTPS server (uncomment when certs are available)
    # server {
    #     listen 443 ssl http2;
    #     server_name *.ela.city ela.city;
    #
    #     # SSL certificates
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     # SSL configuration
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location / {
    #         proxy_pass http://gateways;
    #         proxy_http_version 1.1;
    #         
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         
    #         # WebSocket support
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #         
    #         proxy_connect_timeout 60s;
    #         proxy_send_timeout 60s;
    #         proxy_read_timeout 60s;
    #         
    #         proxy_buffering off;
    #         proxy_request_buffering off;
    #     }
    # }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;
}
