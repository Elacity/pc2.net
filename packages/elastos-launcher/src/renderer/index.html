<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>ElastOS Personal Cloud</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="hardware-box">
    <!-- Title Bar (for dragging) -->
    <div class="title-bar">
      <span class="title">ElastOS Personal Cloud</span>
    </div>

    <!-- Hardware Unit -->
    <div class="unit">
      <!-- Front Panel -->
      <div class="front-panel">
        <!-- Status Display -->
        <div class="status-display">
          <div class="led-container">
            <div class="led" id="status-led"></div>
            <span class="status-text" id="status-text">Checking...</span>
          </div>
        </div>

        <!-- Power Button -->
        <button class="power-button" id="power-btn" title="Power">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0"/>
          </svg>
        </button>
      </div>

      <!-- Control Panel -->
      <div class="control-panel">
        <button class="control-btn primary" id="open-btn" disabled>
          <span class="icon">🌐</span>
          <span>Open My Cloud</span>
        </button>
        
        <button class="control-btn" id="logs-btn">
          <span class="icon">📊</span>
          <span>View Logs</span>
        </button>
      </div>

      <!-- Info Panel -->
      <div class="info-panel" id="info-panel">
        <div class="info-row">
          <span class="info-label">Version</span>
          <span class="info-value" id="version">0.1.1</span>
        </div>
        <div class="info-row">
          <span class="info-label">URL</span>
          <span class="info-value">localhost:4200</span>
        </div>
      </div>

      <!-- Logs Panel (hidden by default) -->
      <div class="logs-panel hidden" id="logs-panel">
        <div class="logs-header">
          <span>Logs</span>
          <button class="close-logs" id="close-logs">✕</button>
        </div>
        <div class="logs-content" id="logs-content"></div>
      </div>

      <!-- Install Panel (shown when not installed) -->
      <div class="install-panel hidden" id="install-panel">
        <div class="install-message">
          <span class="icon">📦</span>
          <p>PC2 is not installed yet.</p>
          <button class="control-btn primary" id="install-btn">
            Install Now
          </button>
        </div>
        <div class="install-progress hidden" id="install-progress">
          <div class="spinner"></div>
          <p id="install-status">Installing...</p>
        </div>
      </div>
    </div>

    <!-- Bottom Panel (decorative) -->
    <div class="bottom-panel">
      <div class="vents">
        <div class="vent"></div>
        <div class="vent"></div>
        <div class="vent"></div>
      </div>
      <div class="indicator-lights">
        <div class="indicator" id="indicator-1"></div>
        <div class="indicator" id="indicator-2"></div>
        <div class="indicator" id="indicator-3"></div>
      </div>
      <span class="brand">Presented by Elacity Labs</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
