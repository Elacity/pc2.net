[package]
name = "cenc-encrypt"
version = "1.1.0"
edition = "2021"
description = "CENC (Common Encryption) AES-128-CTR encryptor for fMP4/DASH segments — runs in WASM sandbox"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cenc-encrypt"
path = "src/main.rs"

[dependencies]
aes = "0.8"
ctr = "0.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
