                }

                // Primary classifier: the backend's explicit isSystem flag
                // (added 2026-04-29 — see DAPP-CENTRE-BUILTIN-CLASSIFICATION
                // task). Fall back to the old inverse-of-installed inference
                // only if the backend response carries no isSystem flag at
                // all (older PC2 node behind new frontend).
                const hasSystemFlag = launchApps.some(a => a.isSystem !== undefined);
                const isSystemApp = hasSystemFlag
                    ? (a) => a.isSystem === true
                    : (a) => !installedNames.has(a.name);

                builtInApps = launchApps
                    .filter(a => a.name !== 'app-center' && isSystemApp(a))
                    .map(a => ({
                        id: a.name,
                        name: a.title || a.name,
                        developer: 'System',
                        icon: a.icon,
                        version: a.version || '',
                        description: a.description || '',
                        isBuiltIn: true,
                installed: true,
                    }));
            } catch (err) {
                console.error('[dApp Centre] Failed to load data:', err);
            }
            isLoading = false;
            mergeApps();
        }

        function mergeApps() {
            // Same tolerant read as loadData — see DAPP-UX-POLISH-V12 #1.
            const installedNames = new Set(
                installedApps.map(a => a.app_name ?? a.name).filter(Boolean)
            );
            const builtInNames = new Set(builtInApps.map(a => a.id));

            allApps = [];

            // 1. Add catalog apps with install status.
            // Install signal = primary (/api/installed-apps) OR built-in flag
            // OR launchApps fallback (if primary failed). Built-in flag is
            // authoritative — it comes from the backend's isSystem field
            // (hardcoded core apps) OR the registry manifest role === 'system'
            // (the four pre-installed dApp capsules: Market, Player, Creator,
            // dDRM Viewer). System-role apps must not be uninstallable from
            // the dApp Centre — the boot policy will just re-install them on
            // next start, and accidentally removing the marketplace would
            // brick the user's content access. See DAPP-UX-POLISH-V12 follow-up.
            for (const cat of catalogApps) {
                const isInstalled = installedNames.has(cat.id)
                    || builtInNames.has(cat.id)
                    || launchInstalledNames.has(cat.id);
                const isBuiltIn = builtInNames.has(cat.id) || cat.role === 'system';
                const isComingSoon = !isInstalled && (cat.registryStatus === 'coming_soon' || (!cat.cid && cat.registryStatus !== 'available'));
                // For installed apps, prefer the backend-resolved bundle icon
                // (the real branded logo) over the registry's category SVG
                // key. Non-installed apps keep the category glyph so the
                // "discover" feel is preserved. See DAPP-UX-POLISH-V12 #2.
                const realIcon = isInstalled ? launchAppIcons[cat.id] : null;
                // Device-compatibility gate: only relevant for not-yet-installed
                // apps that declare requirements.platform. Installed apps stay
                // openable; if hostPlatform is unknown we skip the gate (fail-open
                // in the UI — the server still enforces on install).
                let compat = (!isInstalled && cat.platformReq)
                    ? isHostCompatible(cat.platformReq, hostPlatform)
                    : { compatible: true };
                // Per-arch capsules: even when platformReq's arch union allows
                // this host (e.g. arch:["x64","arm64"]), there may be no PUBLISHED
                // variant for the host's actual arch yet (x64-first rollout). In
                // that case the install would fail server-side, so gate it out
                // here with a clearer "coming soon" message.
                if (compat.compatible && !isInstalled && hostPlatform && cat.distribution?.variants) {
                    const variantKey = `${hostPlatform.os}-${hostPlatform.arch}`;
                    if (!cat.distribution.variants[variantKey]) {
                        const haveArches = Object.keys(cat.distribution.variants)
                            .map(k => k.split('-').slice(1).join('-')).join(', ');
                        compat = {
                            compatible: false,
                            reason: `No ${hostPlatform.arch} build available yet (published: ${haveArches || 'none'})`,
                        };
                    }
                }
                allApps.push({
                    ...cat,
                    installed: isInstalled,
                    isBuiltIn: isBuiltIn,
                    isComingSoon,
                    incompatibleReason: compat.compatible ? null : compat.reason,
                    builtInIcon: realIcon || null,
                });
            }

            // 2. Add installed apps not already in catalog
            for (const inst of installedApps) {
                const instId = inst.app_name ?? inst.name;
                if (!instId) continue;
                if (!catalogApps.find(c => c.id === instId)) {
                    const meta = builtInMeta[instId] || {};
                    let iconDataUrl = launchAppIcons[instId] || null;
                    // Fall back to scraping the stored manifest in case the
                    // /get-launch-apps lookup missed it (e.g. hidden apps).
                    if (!iconDataUrl) {
                        try {
                            if (inst.manifest_json) {
                                const m = JSON.parse(inst.manifest_json);
                                if (m.iconDataUrl) iconDataUrl = m.iconDataUrl;
                            }
                        } catch { /* ignore */ }
                    }
                    allApps.push({
                        id: instId,
                        name: inst.title || instId,
                        developer: inst.author || 'Unknown',
                        category: meta.category || 'tools',
                        description: inst.description || '',
                        shortDesc: '',
                        size: '',
                        version: inst.version || '',
                        icon: meta.iconKey || 'package',
                        gradient: meta.gradient || 'gradient-slate',
                        badges: [],
                        permissions: inst.permissions || [],
                        requirements: { storage: '-', memory: '-', compatibility: 'PC2 1.0+' },
                        installed: true,
                        isBuiltIn: false,
                        isComingSoon: false,
                isPopular: false,
                        isStaffPick: false,
                        builtInIcon: iconDataUrl,
                        website: null, source: null,
                    });
                }
            }

            // 3. Add built-in apps not already in catalog
            for (const bi of builtInApps) {
                if (!catalogApps.find(c => c.id === bi.id)) {
                    const meta = builtInMeta[bi.id] || {};
                    allApps.push({
                        id: bi.id,
                        name: bi.name,
                        developer: 'System',
                        category: meta.category || 'system',
                        description: meta.desc || bi.description || '',
                        shortDesc: '',
                        size: '',
                        version: bi.version || '',
                        icon: meta.iconKey || 'package',
                        gradient: meta.gradient || 'gradient-slate',
                        badges: ['builtin'],
                        permissions: [],
                        requirements: { storage: '-', memory: '-', compatibility: 'PC2 1.0+' },
                installed: true,
                        isBuiltIn: true,
                        isComingSoon: false,
                isPopular: false,
                        isStaffPick: false,
                        builtInIcon: bi.icon,
                        website: null, source: null,
                    });
                }
            }
        }

        // ==================== RENDERING ====================
        function render() {
            renderStaffPicks();
            renderPopularApps();
            renderAppsGrid();
            renderInstalledApps();
            updateInstalledBadge();
        }

        function getAppIconHtml(app, cssClass) {
            // Prefer a real bundle icon (data: URL or path) when available —
            // this is what makes installed apps show their branded logo
            // instead of the registry's category SVG. Both `data:` and
            // `/installed-apps/<name>/…` URLs are safe in <img src>; anything
            // else falls through to the category glyph. The `.has-img`
            // modifier strips the contrasting tile background so the logo's
            // own design (most ship a self-contained square) reads clean
            // edge-to-edge inside the rounded mask.
            if (app.builtInIcon && /^(data:|https?:|\/)/.test(app.builtInIcon)) {
                return `<div class="app-icon has-img ${cssClass || ''}"><img src="${app.builtInIcon}" alt=""></div>`;
            }
            const gradient = app.gradient || 'gradient-slate';
            const svgIcon = icons[app.icon] || icons.package;
            return `<div class="app-icon ${gradient} ${cssClass || ''}">${svgIcon}</div>`;
        }

        function getAppBadges(app) {
            const badgeList = app.badges || [];
            const extra = [];
            if (app.isBuiltIn) extra.push('<span class="badge builtin">System</span>');
            if (app.isComingSoon) extra.push('<span class="badge coming-soon">Coming Soon</span>');
            const badgeTexts = {
                wasm: 'WASM',
                ddrm: 'dDRM',
                opensource: 'Open Source',
                builtin: 'System',
                nft: 'NFT',
                creator: 'Creator',
            };
            const rendered = badgeList
                .filter(b => b !== 'builtin')
                .map(b => `<span class="badge ${b}">${badgeTexts[b] || b}</span>`)
                .join('');
            return rendered + extra.join('');
        }

        function getActionButton(app) {
            if (app.installed || app.isBuiltIn) {
                return `<button class="install-btn installed" onclick="event.stopPropagation(); openApp('${app.id}')">Open</button>`;
            }
            if (app.isComingSoon) {
                return `<button class="install-btn coming-soon" onclick="event.stopPropagation();">Coming Soon</button>`;
            }
            if (app.incompatibleReason) {
                return `<button class="install-btn incompatible" title="${escAttr(app.incompatibleReason)}" onclick="event.stopPropagation();">Not compatible</button>`;
            }
            return `<button class="install-btn" onclick="event.stopPropagation(); installApp('${app.id}')">Install</button>`;
        }

        function renderAppCard(app) {
            return `
                <div class="app-card" onclick="showAppDetail('${app.id}')">
                    <div class="app-card-header">
                        ${getAppIconHtml(app)}
                        <div class="app-card-info">
                            <div class="app-name">${app.name}</div>
                            <div class="app-developer">${app.developer}</div>
                            <div class="app-version-row">
                                ${app.version ? `<span class="app-version">v${app.version}</span>` : ''}
                                <div class="app-badges">${getAppBadges(app)}</div>
                            </div>
                        </div>
                    </div>
                    <div class="app-description">${app.description}</div>
                    <div class="app-card-footer">
                        <div class="app-footer-left">
                            ${app.size ? `<span class="app-size">${app.size}</span>` : ''}
                            <span class="app-price free">Free</span>
                        </div>
                        ${getActionButton(app)}
                    </div>
                </div>
            `;
        }
        
        // Visual gradients for staff-pick cards. Keyed by the app's
        // `gradient` field from the registry (or builtInMeta for system
        // apps). Used as the card background when no banner image is set.
        const STAFF_PICK_GRADIENTS = {
            'gradient-purple': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'gradient-blue':   'linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%)',
            'gradient-orange': 'linear-gradient(135deg, #f97316 0%, #ea580c 100%)',
            'gradient-green':  'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)',
            'gradient-teal':   'linear-gradient(135deg, #14b8a6 0%, #0d9488 100%)',
            'gradient-pink':   'linear-gradient(135deg, #ec4899 0%, #db2777 100%)',
            'gradient-yellow': 'linear-gradient(135deg, #eab308 0%, #ca8a04 100%)',
            'gradient-indigo': 'linear-gradient(135deg, #6366f1 0%, #4f46e5 100%)',
            'gradient-cyan':   'linear-gradient(135deg, #06b6d4 0%, #0891b2 100%)',
            'gradient-slate':  'linear-gradient(135deg, #64748b 0%, #475569 100%)',
        };

        // Render the icon for a staff-pick card. Prefers the real bundle
        // logo (data: URL or /installed-apps/<name>/…) when available — the
        // generic registry SVG glyph (`swap`, `image`, …) is a poor stand-in
        // for an app's actual brand. See DAPP-UX-POLISH-V12 follow-up.
        function getStaffPickIconHtml(app) {
            if (app.builtInIcon && /^(data:|https?:|\/)/.test(app.builtInIcon)) {
                return `<div class="staff-pick-icon has-img"><img src="${app.builtInIcon}" alt=""></div>`;
            }
            const svgIcon = icons[app.icon] || icons.package;
            return `<div class="staff-pick-icon">${svgIcon}</div>`;
        }

        function renderStaffPicks() {
            const container = document.getElementById('staffPicks');
            const picks = allApps.filter(a => a.isStaffPick).slice(0, 5);
            if (picks.length === 0) {
                document.getElementById('staffPicksSection').style.display = 'none';
                return;
            }
            container.innerHTML = picks.map(app => {
                const bg = STAFF_PICK_GRADIENTS[app.gradient] || STAFF_PICK_GRADIENTS['gradient-purple'];
                // Optional registry-supplied hero image. When present the
                // gradient is used as fallback paint behind it, and the
                // dark veil keeps the title legible. Forward-compat — the
                // current registry doesn't ship `banner` yet.
                const bannerLayer = app.banner
                    ? `<div class="staff-pick-banner" style="background-image:url('${app.banner}');"></div>`
                    : '';
                const tag = (app.category || '').toUpperCase();
                return `
                <div class="staff-pick-card" style="background:${bg};" onclick="showAppDetail('${app.id}')">
                    ${bannerLayer}
                    ${getStaffPickIconHtml(app)}
                    ${tag ? `<span class="staff-pick-tag">${tag}</span>` : ''}
                    <div class="staff-pick-content">
                        <div class="staff-pick-name">${app.name}</div>
                        <div class="staff-pick-desc">${app.shortDesc || (app.description || '').substring(0, 80) + ((app.description || '').length > 80 ? '…' : '')}</div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function renderPopularApps() {
            const container = document.getElementById('popularApps');
            const apps = allApps.filter(a => a.isPopular);
            container.innerHTML = apps.map(renderAppCard).join('');
        }
        
        const categoryNames = {
            all: 'All Apps',
            marketplace: 'Marketplace',
            media: 'Media',
            defi: 'DeFi',
            blockchain: 'Blockchain',
            tools: 'Tools',
            system: 'System',
        };

        function selectCategory(category) {
                document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
            const el = document.querySelector(`[data-category="${category}"]`);
            if (el) el.classList.add('active');
            currentCategory = category;
            
            const staffSection = document.getElementById('staffPicksSection');
            const popularSection = document.getElementById('popularSection');
            const titleEl = document.getElementById('allAppsSectionTitle');
            
            if (category === 'all') {
                staffSection.style.display = 'block';
                popularSection.style.display = 'block';
                titleEl.textContent = 'All Apps';
            } else {
                staffSection.style.display = 'none';
                popularSection.style.display = 'none';
                titleEl.textContent = categoryNames[category] || category;
            }
            renderAppsGrid();
        }
        
        function renderAppsGrid(filter = '') {
            const grid = document.getElementById('appsGrid');
            let apps = allApps;
            
            if (currentCategory !== 'all') {
                apps = apps.filter(app => app.category === currentCategory);
            }
            if (filter) {
                const q = filter.toLowerCase();
                apps = apps.filter(app => 
                    app.name.toLowerCase().includes(q) ||
                    app.description.toLowerCase().includes(q) ||
                    app.developer.toLowerCase().includes(q)
                );
            }
            if (apps.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <div class="empty-icon">${icons.search}</div>
                        <div class="empty-title">No apps found</div>
                        <div class="empty-description">Try a different search or category</div>
                    </div>`;
                    return;
                }
            grid.innerHTML = apps.map(renderAppCard).join('');
        }
        
        function renderInstalledApps() {
            const list = document.getElementById('installedList');
            const installed = allApps.filter(app => app.installed);
            
            if (installed.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">${icons.package}</div>
                        <div class="empty-title">No apps installed</div>
                        <div class="empty-description">Browse the Discover tab to find apps</div>
                    </div>`;
                return;
            }
            
            list.innerHTML = installed.map(app => `
                <div class="installed-item">
                    ${getAppIconHtml(app)}
                    <div class="installed-info">
                        <div class="installed-name">${app.name}</div>
                        <div class="installed-meta">${app.version ? 'v' + app.version : ''} ${app.isBuiltIn ? '· System' : ''} ${app.size ? '· ' + app.size : ''}</div>
                            </div>
                    <div class="installed-actions">
                        <button class="action-btn open" onclick="openApp('${app.id}')">Open</button>
                        ${!app.isBuiltIn ? `<button class="action-btn uninstall" onclick="uninstallApp('${app.id}')">Uninstall</button>` : ''}
                        </div>
                        </div>
            `).join('');
        }
        
        function updateInstalledBadge() {
            const count = allApps.filter(a => a.installed).length;
            const badge = document.getElementById('installedBadge');
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'inline';
            } else {
                badge.style.display = 'none';
            }
        }

        // ==================== APP DETAIL MODAL ====================
        function showAppDetail(appId) {
            const app = allApps.find(a => a.id === appId);
            if (!app) return;
            
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailContent');

            let actionBtn;
            let uninstallBtn = '';
            if (app.installed || app.isBuiltIn) {
                actionBtn = `<button class="modal-btn primary" onclick="closeDetailModal(); openApp('${app.id}')">Open</button>`;
                // User-installed apps may be removed from the modal too;
                // built-in/system apps cannot.
                if (app.installed && !app.isBuiltIn) {
                    uninstallBtn = `<button class="modal-btn danger" onclick="closeDetailModal(); uninstallApp('${app.id}')">Uninstall</button>`;
                }
            } else if (app.isComingSoon) {
                actionBtn = `<button class="modal-btn disabled">Coming Soon</button>`;
            } else if (app.incompatibleReason) {
                actionBtn = `<button class="modal-btn disabled" title="${escAttr(app.incompatibleReason)}">Not compatible with this device</button>`;
            } else {
                actionBtn = `<button class="modal-btn primary" onclick="closeDetailModal(); installApp('${app.id}')">Install</button>`;
            }
            
            content.innerHTML = `
                <div class="modal-header">
                    ${getAppIconHtml(app, 'modal-icon-size')}
                    <div class="modal-title-section">
                        <div class="modal-title">${app.name}</div>
                        <div class="modal-developer">${app.developer}</div>
                        ${app.version ? `<div class="modal-version">Version ${app.version}</div>` : ''}
                        <div class="modal-badges">${getAppBadges(app)}</div>
                    </div>
                    <button class="modal-close" onclick="closeDetailModal()">${icons.close}</button>
                </div>
                <div class="modal-body">
                    <div class="modal-section">
                        <div class="modal-section-title">About</div>
                        <div class="modal-description">${app.description}</div>
                    </div>
                    ${app.incompatibleReason ? `<div class="modal-incompat-note">Not compatible with this device — ${escAttr(app.incompatibleReason)}</div>` : ''}
                    ${app.requirements ? `
                    <div class="modal-section">
                        <div class="modal-section-title">Requirements</div>
                        <div class="requirements-grid">
                            <div class="requirement-item">
                                <div class="requirement-value">${app.requirements.storage}</div>
                                <div class="requirement-label">Storage</div>
                            </div>
                            <div class="requirement-item">
                                <div class="requirement-value">${app.requirements.memory}</div>
                                <div class="requirement-label">Memory</div>
                            </div>
                            <div class="requirement-item">
                                <div class="requirement-value">${app.requirements.compatibility}</div>
                                <div class="requirement-label">Compatibility</div>
                            </div>
                        </div>
                    </div>` : ''}
                    ${app.permissions && app.permissions.length > 0 ? `
                    <div class="modal-section">
                        <div class="modal-section-title">Permissions</div>
                        <ul class="permissions-list">
                            ${app.permissions.map(p => `<li><span class="permission-icon">${icons.check}</span> ${p}</li>`).join('')}
                        </ul>
                    </div>` : ''}
                    ${(app.website || app.source) ? `
                    <div class="modal-section">
                        <div class="modal-section-title">Developer</div>
                        <div class="developer-links">
                            ${app.website ? `<a class="dev-link" href="${app.website}" target="_blank">${icons.link} Website</a>` : ''}
                            ${app.source ? `<a class="dev-link" href="${app.source}" target="_blank">${icons.github} Source Code</a>` : ''}
                        </div>
                    </div>` : ''}
                </div>
                <div class="modal-footer">
                    <div class="modal-footer-price">
                        <span class="price-tag free">Free</span>
                    </div>
                    <div class="modal-footer-actions">
                        <button class="modal-btn secondary" onclick="closeDetailModal()">Close</button>
                        ${uninstallBtn}
                        ${actionBtn}
                    </div>
                </div>
            `;
            modal.classList.add('active');
        }
        
        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }
        
        // ==================== INSTALL / UNINSTALL / OPEN ====================

        // Current install target — progress events coming in on the
        // `apps:installProgress` postMessage channel are matched against
        // this to avoid updating the modal for a different in-flight
        // install. See DAPP-UX-POLISH-V12 #6.
        let currentInstallAppId = null;

        // Human-readable labels for the server-side stages (pc2-node
        // `AppInstallService.install` emits these). Anything unknown
        // falls back to a generic message so an older backend still
        // looks OK.
        const INSTALL_STAGE_LABELS = {
            fetching: 'Fetching package from IPFS…',
            verifying: 'Verifying package…',
            extracting: 'Extracting files…',
            registering: 'Registering app…',
            done: 'Install complete',
            failed: 'Install failed',
        };

        function updateInstallProgress(stage, pct, meta) {
            const statusEl = document.getElementById('installStatus');
            const fillEl = document.getElementById('progressFill');
            if (!statusEl || !fillEl) return;

            let label = INSTALL_STAGE_LABELS[stage] || 'Working…';
            // Augment with byte/file counts when the server provides them so
            // the user sees concrete movement during the long extract stage.
            if (meta && typeof meta.filesExtracted === 'number' && typeof meta.totalFiles === 'number') {
                label += ` (${meta.filesExtracted}/${meta.totalFiles} files)`;
            } else if (meta && typeof meta.bytesReceived === 'number' && typeof meta.totalBytes === 'number' && meta.totalBytes > 0) {
                const mb = (meta.bytesReceived / 1048576).toFixed(1);
                const total = (meta.totalBytes / 1048576).toFixed(1);
                label += ` (${mb} / ${total} MB)`;
            }

            statusEl.textContent = label;
            if (typeof pct === 'number') {
                const clamped = Math.max(0, Math.min(100, pct));
                fillEl.style.width = clamped + '%';
            }
        }

        async function installApp(appId) {
            const app = allApps.find(a => a.id === appId);
            if (!app) return;

            if (app.isComingSoon || app.installed) return;

            // Device-compatibility gate (client-side; server re-enforces).
            if (app.incompatibleReason) {
                showToast(`Not compatible with this device — ${app.incompatibleReason}`, true);
                return;
            }

            // CID-based install: require a CID on the catalog entry
            if (!app.cid) {
                showToast('This app does not have an IPFS package yet. Coming soon!', true);
                return;
            }

            currentInstallAppId = app.id;

            const modal = document.getElementById('installModal');
            const content = document.getElementById('installContent');
            const iconHtml = getAppIconHtml(app, 'install-modal-icon');
            
            content.innerHTML = `
                ${iconHtml}
                <div class="install-modal-title">Installing ${app.name}</div>
                <div class="install-modal-status" id="installStatus">${INSTALL_STAGE_LABELS.fetching}</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 5%"></div>
                </div>
                <button class="modal-btn secondary" onclick="closeInstallModal()">Cancel</button>
            `;
            modal.classList.add('active');
            
            try {
                // Scripted "something is happening" stages as a safety net
                // in case the server doesn't emit real progress (e.g. an
                // older backend). Real events from install:progress override
                // these via updateInstallProgress.
                updateInstallProgress('fetching', 10);

                // Start from the publisher's full manifest (type, backend,
                // externalDataDirs, capabilities, display, distribution) so
                // service apps spawn their backend and pass the signature gate.
                // Fall back to {} for built-ins/launch apps that have no raw
                // manifest. Identity fields are overridden from the catalog.
                const baseManifest = app.rawManifest ? { ...app.rawManifest } : {};
                const manifest = {
                    ...baseManifest,
                    name: app.id,
                    title: app.name,
                    version: app.version || baseManifest.version || '1.0.0',
                    description: app.description ?? baseManifest.description,
                    author: app.developer ?? baseManifest.author,
                    entry: baseManifest.entry || 'index.html',
                    permissions: app.permissions || baseManifest.permissions || [],
                    // Echo the registry requirements (incl. platform) so the
                    // server's defense-in-depth compatibility check runs against
                    // the same constraints the UI gated on.
                    ...(app.manifestRequirements ? { requirements: app.manifestRequirements } : {}),
                    // Distribution carries signature/signedBy (required for the
                    // service-app Ed25519 gate) and per-arch `variants` (the
                    // server resolves the capsule for its own architecture).
                    ...(app.distribution ? { distribution: app.distribution } : {}),
                };

                const res = await pc2Fetch('/api/installed-apps/install', {
                    method: 'POST',
                    body: { manifest, cid: app.cid },
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || 'Install failed');
                }

                updateInstallProgress('done', 100);

                // Refresh local state and re-render
                await loadData();
                render();

                // Tell the parent Puter window that the installed-apps set
                // has changed so the Start Menu drops its stale cache.
                // DAPP-UX-POLISH-V12 #4.
                try { window.parent.postMessage({ msg: 'apps:changed' }, '*'); } catch { /* ignore */ }

                    content.innerHTML = `
                    ${iconHtml}
                    <div class="install-modal-title">${app.name} Installed</div>
                        <div class="install-modal-status" style="color:#22c55e;display:flex;align-items:center;justify-content:center;gap:6px;">
                        ${icons.check} Successfully installed
                        </div>
                        <button class="modal-btn primary" onclick="closeInstallModal(); openApp('${app.id}')">Open App</button>
                    `;
            } catch (err) {
                content.innerHTML = `
                    ${iconHtml}
                    <div class="install-modal-title">Install Failed</div>
                    <div class="install-modal-status" style="color:#ef4444;">${err.message}</div>
                    <button class="modal-btn secondary" onclick="closeInstallModal()">Close</button>
                `;
            } finally {
                currentInstallAppId = null;
            }
        }
        
        function closeInstallModal() {
            document.getElementById('installModal').classList.remove('active');
        }
        
        async function uninstallApp(appId) {
            const app = allApps.find(a => a.id === appId);
            if (!app || app.isBuiltIn) return;

            if (!confirm(`Uninstall ${app.name}?\n\nThis will remove the app and its data.`)) return;

            try {
                const res = await pc2Fetch(`/api/installed-apps/${encodeURIComponent(appId)}`, {
                    method: 'DELETE',
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || 'Uninstall failed');
                }

                showToast(`${app.name} uninstalled`);
                await loadData();
                render();
                // Notify the parent so the Start Menu drops its stale
                // copy (DAPP-UX-POLISH-V12 #4).
                try { window.parent.postMessage({ msg: 'apps:changed' }, '*'); } catch { /* ignore */ }
            } catch (err) {
                showToast(`Failed to uninstall: ${err.message}`, true);
            }
        }

        // ==================== INSTALL PROGRESS BRIDGE ====================
        // The parent Puter GUI listens on the authenticated Socket.io
        // connection for `install:progress` events emitted by the pc2-node
        // install pipeline and forwards them here via postMessage. See
        // DAPP-UX-POLISH-V12 #6.
        window.addEventListener('message', (ev) => {
            if (!ev.data || ev.data.msg !== 'apps:installProgress') return;
            const { appName, stage, pct, meta } = ev.data;
            if (!currentInstallAppId || appName !== currentInstallAppId) return;
            updateInstallProgress(stage, pct, meta);
        });

        function openApp(appId) {
            window.parent.postMessage({
                msg: 'launchApp',
                appName: appId,
            }, '*');
        }

        // ==================== TOAST ====================
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        // ==================== EVENT LISTENERS ====================
        function setupEventListeners() {
            // Theme toggle
            const themeBtn = document.getElementById('themeToggle');
            if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

            // Tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTab = tab.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(`${currentTab}-content`).classList.add('active');
                });
            });
            
            // Categories
            document.querySelectorAll('.category-item').forEach(item => {
                item.addEventListener('click', () => {
                    selectCategory(item.dataset.category);
                });
            });
            
            // Search
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    renderAppsGrid(e.target.value);
                }, 200);
            });
            
            // Close modals on overlay click
            document.querySelectorAll('.modal-overlay').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.classList.remove('active');
                    }
                });
            });
        }
        
        // ==================== START ====================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
