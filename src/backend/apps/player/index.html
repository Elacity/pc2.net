<body style="padding:0; margin: 0; height:calc(100vh); background-size: contain; width:100%; background-position: center; background-repeat: no-repeat;">
    <video id="player" width="320" height="240" controls autoplay preload="auto" crossorigin="anonymous" playsinline></video>
    <!-- JS -->
    <script>
        // CRITICAL: Intercept API calls BEFORE SDK loads to redirect to PC2 node
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const apiOrigin = urlParams.get('puter.api_origin') || window.location.origin;
            
            const originalFetch = window.fetch;
            window.fetch = function(...args) {
                let url = args[0];
                if (typeof url === 'string' && url.includes('api.puter.')) {
                    args[0] = url.replace(/https?:\/\/api\.puter\.[^\/:]+(?::\d+)?/gi, apiOrigin);
                } else if (url && typeof url === 'object' && url.url && url.url.includes('api.puter.')) {
                    url.url = url.url.replace(/https?:\/\/api\.puter\.[^\/:]+(?::\d+)?/gi, apiOrigin);
                }
                return originalFetch.apply(this, args);
            };
            
            const originalXHROpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                if (typeof url === 'string' && url.includes('api.puter.')) {
                    url = url.replace(/https?:\/\/api\.puter\.[^\/:]+(?::\d+)?/gi, apiOrigin);
                }
                return originalXHROpen.call(this, method, url, ...rest);
            };
        })();
    </script>
    <script src="./js/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <script src="./js/puter-sdk/puter-sdk-v2.js"></script>
    <script>
        // Initialize Puter SDK with auth token and API origin from URL params
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const authToken = urlParams.get('puter.auth.token');
            const apiOrigin = urlParams.get('puter.api_origin');
            
            function initializeSDK() {
                if (typeof puter === 'undefined') {
                    setTimeout(initializeSDK, 10);
                    return;
                }
                
                if (authToken) {
                    try {
                        puter.setAuthToken(authToken);
                        console.log('[Player]: ✅ Auth token set from URL params');
                    } catch (e) {
                        console.error('[Player]: Failed to set auth token:', e);
                    }
                }
                
                if (apiOrigin) {
                    try {
                        puter.setAPIOrigin(apiOrigin);
                        console.log('[Player]: ✅ API origin set to:', apiOrigin);
                    } catch (e) {
                        console.error('[Player]: Failed to set API origin:', e);
                    }
                }
            }
            
            initializeSDK();
        })();
    </script>
    <script src="./js/html-entities.js"></script>
    <script>
    let curfile;

    puter.ui.onItemsOpened (async (items)=>{
        if(items.length > 0){
            curfile = items[0];
            puter.ui.setWindowTitle(curfile.name);
            open_file(curfile)
        }
    })

    const MIME_TYPES = {
        'mp4': 'video/mp4', 'm4v': 'video/mp4', 'av1': 'video/mp4',
        'webm': 'video/webm', 'ogg': 'video/ogg', 'ogv': 'video/ogg',
        'mov': 'video/quicktime', 'avi': 'video/x-msvideo',
        'mkv': 'video/x-matroska', 'ts': 'video/mp2t',
        'mp3': 'audio/mpeg', 'wav': 'audio/wav', 'flac': 'audio/flac',
        'm4a': 'audio/mp4', 'aac': 'audio/aac', 'opus': 'audio/opus'
    };

    // Containers Firefox cannot play natively -- offer fallback hints
    const FIREFOX_UNSUPPORTED_CONTAINERS = ['mkv', 'avi', 'mov', 'ts'];

    function isFirefox() {
        return navigator.userAgent.toLowerCase().includes('firefox');
    }

    function showPlayerError(msg) {
        const video = document.getElementById('player');
        const existing = document.getElementById('player-error');
        if (existing) existing.remove();
        const overlay = document.createElement('div');
        overlay.id = 'player-error';
        overlay.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);color:#fff;font-family:system-ui,sans-serif;padding:32px;text-align:center;z-index:10;';
        overlay.innerHTML = '<div style="max-width:420px;"><p style="font-size:16px;line-height:1.5;margin:0;">' + msg + '</p></div>';
        video.parentNode.appendChild(overlay);
    }

    function clearPlayerError() {
        const existing = document.getElementById('player-error');
        if (existing) existing.remove();
    }

    async function open_file(cfile){
        curfile = cfile;
        const video = $("#player").get(0);

        video.pause();
        video.currentTime = 0;
        video.innerHTML = '';
        clearPlayerError();

        const videoUrl = html_encode(curfile.readURL);
        const ext = curfile.name.split('.').pop().toLowerCase();

        // Firefox cannot play certain container formats via <video>
        if (isFirefox() && FIREFOX_UNSUPPORTED_CONTAINERS.includes(ext)) {
            showPlayerError(
                'Firefox cannot play <strong>.' + ext + '</strong> files natively.<br><br>' +
                'Try renaming/remuxing to <strong>.mp4</strong> or <strong>.webm</strong>, ' +
                'or open in Chrome/Edge which has broader container support.'
            );
        }

        video.src = videoUrl;

        puter.ui.setWindowTitle(curfile.name);
        video.load();

        const playWhenReady = function() {
            if (video.readyState >= 1) {
                video.play().catch(err => {
                    console.log('[Player]: Autoplay blocked, user interaction required:', err);
                });
            } else {
                setTimeout(playWhenReady, 100);
            }
        };

        video.addEventListener('loadedmetadata', function() {
            clearPlayerError();
            console.log('[Player]: Video metadata loaded, duration:', video.duration);
            if (video.seekable.length > 0) {
                console.log('[Player]: Seekable from', video.seekable.start(0), 'to', video.seekable.end(0));
            }
            playWhenReady();
        }, { once: true });

        video.addEventListener('canplay', function() {
            clearPlayerError();
        }, { once: true });

        video.addEventListener('seeking', function() {
            console.log('[Player]: Seeking to:', video.currentTime, 'seconds');
        });
        video.addEventListener('seeked', function() {
            console.log('[Player]: Seeked to:', video.currentTime, 'seconds');
        });

        video.addEventListener('error', function(e) {
            const code = video.error?.code;
            const msg = video.error?.message || '';
            console.error('[Player]: Video error:', code, msg);

            if (code === 4) {
                // MEDIA_ERR_SRC_NOT_SUPPORTED
                let hint = 'This video format is not supported by your browser.';
                if (isFirefox()) {
                    hint += '<br><br>Firefox has limited container support. ' +
                            'Try <strong>Chrome</strong> or <strong>Edge</strong>, or remux the file to <strong>.mp4</strong> / <strong>.webm</strong>.';
                }
                showPlayerError(hint);
            }
        }, { once: true });
    }

    $('#player').on('dragover', function(e) {
        e.preventDefault();
        e.stopPropagation();
    })
    $('#player').on('dragenter', function (e) {
        e.preventDefault();
        e.stopPropagation();
    })

    $('#player').on('drop', async function (e) {
        if (e.originalEvent.dataTransfer && e.originalEvent.dataTransfer.files.length) {
            e.preventDefault();
            e.stopPropagation();
            let URL = window.URL || window.webkitURL
            let file = e.originalEvent.dataTransfer.files[0];
            // set file name 
            default_file_name = file.name;
            // change window title
            puter.ui.setWindowTitle(file.name)
            // curfile is dead
            curfile = undefined;
            // read content - set source directly for better seeking support
            const video = $("#player").get(0);
            // Pause and reset first
            video.pause();
            video.currentTime = 0;
            // Clear existing sources
            video.innerHTML = '';
            // Set source directly on video element
            video.src = URL.createObjectURL(file);
            video.type = file.type || 'video/mp4';
            // restart video - this ensures seeking is enabled
            video.load();
            // Wait for metadata to load before playing (enables seeking)
            video.addEventListener('loadedmetadata', function() {
                console.log('[Player]: Drag-drop video loaded, duration:', video.duration);
                video.play();
            }, { once: true });
        }
    });
    </script>
</body>
